name: DNSHE Auto Renew

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run renewal check
        env:
          DNSHE_API_KEY: ${{ secrets.DNSHE_API_KEY }}
          DNSHE_API_SECRET: ${{ secrets.DNSHE_API_SECRET }}
          DNSHE_DOMAINS: ${{ secrets.DNSHE_DOMAINS }}
        run: |
          python scripts/dnshe_auto_renew.py
      
      - name: Keepalive
        run: |
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            date -u > .keepalive
            git add .keepalive
            git commit -m "keepalive $(date -u +%Y-%m-%d)"
            git push
